# 开发环境数据库：docker compose up -d 即可启动 PostgreSQL
services:
  postgres:
    image: postgres:16-alpine
    container_name: stationery-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_dev_password
      POSTGRES_DB: stationery_pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
