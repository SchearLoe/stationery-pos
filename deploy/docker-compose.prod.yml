# 生产部署：API + PostgreSQL
# 用法：docker compose -f deploy/docker-compose.prod.yml up -d
# 注意：先在 apps/server/.env 配置好 DATABASE_URL / JWT_SECRET

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在环境变量中提供数据库密码}
      POSTGRES_DB: stationery_pos
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不对宿主机暴露端口，仅容器网络内访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/server
      dockerfile: ../../deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pos:${POSTGRES_PASSWORD}@postgres:5432/stationery_pos
      JWT_SECRET: ${JWT_SECRET:?请在环境变量中提供 JWT 密钥}
      JWT_EXPIRES: 43200
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
